name: Tag

# Publishing, as one button. Actions cannot block a tag push -- a workflow
# only runs once the ref already exists, and pre-receive hooks are Enterprise
# Server only -- so the tag is not created by hand at all: this workflow runs
# CI first and cuts the release only if it passed. A tag that exists is
# therefore a tag that was green.
#
# The release is what carries the tag. Creating one is a single API call that
# tags the verified commit and gives the version a page with generated notes,
# where pushing a bare tag gave neither.
#
# Packagist's webhook does the rest. Nothing here talks to Packagist, and
# nothing needs to: it is watching the repository for the tag.
#
# There is deliberately no zip to build or upload. Composer downloads GitHub's
# own archive of the tag, and what that archive holds is decided by
# `export-ignore` in `.gitattributes` -- a file attached to a release is
# downloaded by nobody.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.1 or 1.0.0-beta.1 (the leading v is added for you)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      # The commit CI is about to verify, pinned here so the release tags that
      # one rather than whatever main points at by the time it runs.
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Refuse to tag anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main. This run was dispatched against ${GITHUB_REF}."
          exit 1

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and check the tag
        id: resolve
        # Read through the environment rather than interpolating `${{ }}`
        # straight into the script: the input is arbitrary text, and inside a
        # run block that is shell.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::'${VERSION}' is not a version Composer accepts. Expected 0.9.1, or 1.0.0-beta.1 for a pre-release."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists. A published version cannot be replaced -- pick the next one."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Will release ${tag} from $(git rev-parse --short HEAD) once CI passes." >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    needs: check
    uses: ./.github/workflows/ci.yml

  tag:
    name: Cut the release
    needs:
      - check
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      # Creating a release for a tag that does not exist yet creates the tag
      # too, lightweight rather than annotated -- an annotated tag carries a
      # tagger identity, and there is no honest one to give it from a runner.
      # Composer reads both the same way.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          # --target is the commit `verify` just passed, not the current tip:
          # a push landing on main mid-run must not ride out under this tag.
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes

          {
            echo "### Released \`${TAG}\`"
            echo
            echo "Packagist's webhook picks the tag up within a minute or so:"
            echo "<https://packagist.org/packages/zestry-dev/wp-toolkit>"
            echo
            echo "Composer serves GitHub's own archive of that tag. What it"
            echo "holds is decided by \`export-ignore\` in \`.gitattributes\`,"
            echo "so there is no artifact to attach here."
          } >> "$GITHUB_STEP_SUMMARY"
