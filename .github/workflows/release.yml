name: Release

# A tag is the release. Packagist derives the version from it, so there is no
# build artifact to produce and no version to stamp anywhere — pushing
# `v1.2.3` is the whole publish step, and this workflow's job is to refuse a
# tag that should not have been pushed before Packagist can see it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches `config.platform.php` and the wp-env container, so a
          # syntax error that only 8.1 rejects fails here rather than in a
          # consumer's install.
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint
        run: composer lint

      - name: Check the docs are regenerated
        run: composer docs:check

      - name: Check the stubs
        run: composer lint:stubs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Started once and reused: the multisite run installs its own network
      # into the same containers, exactly as it does locally.
      - name: Start wp-env
        run: npm run env:start

      - name: PHPUnit — single site
        run: npm run test:php:base

      - name: PHPUnit — multisite
        run: npm run test:php:ms:base

      - name: Stop wp-env
        if: always()
        run: npm run env:stop

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          # `--generate-notes` diffs against the previous tag, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: Check the tag is a version Composer accepts
        run: |
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a release version. Expected v1.2.3, or v1.2.3-beta.1 for a pre-release."
            exit 1
          fi

      - name: Check composer.json declares no version
        run: |
          if php -r 'exit(isset(json_decode(file_get_contents("composer.json"), true)["version"]) ? 0 : 1);'; then
            echo '::error::composer.json must not declare a "version" field — Packagist reads the version from the tag, and a stale literal silently wins over it.'
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen is the only thing separating v1.2.3 from v1.2.3-beta.1,
          # and it is what Composer itself reads as a pre-release.
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease='--prerelease' ;;
            *)   prerelease='' ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}

      # Only needed if the Packagist GitHub App is not installed on this
      # repository. With the App, Packagist has already seen the tag and this
      # step is skipped for want of the secret.
      - name: Tell Packagist about the tag
        if: ${{ secrets.PACKAGIST_TOKEN != '' }}
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl --silent --show-error --fail \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
